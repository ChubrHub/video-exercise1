<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Wavelength platform roadmap.">
<meta name="robots" content="noindex, nofollow">
<title>Wavelength Platform Roadmap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #F7F6F2;
  --text-primary: #2C2C2A;
  --text-secondary: #5F5E5A;
  --text-tertiary: #888780;
  --border-tertiary: rgba(0,0,0,0.1);
  --border-secondary: rgba(0,0,0,0.18);
  --radius-md: 8px;
  --radius-lg: 12px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
  --phase-gradient: linear-gradient(to right, #F1EFE8 0%, #F1EFE8 100%);
  --phase-gradient-dark: linear-gradient(to right, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.05) 100%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #1A1A1A;
    --bg-secondary: #232321;
    --text-primary: #E8E6DD;
    --text-secondary: #B4B2A9;
    --text-tertiary: #888780;
    --border-tertiary: rgba(255,255,255,0.1);
    --border-secondary: rgba(255,255,255,0.18);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); color: var(--text-primary); background: var(--bg-primary); line-height: 1.5; -webkit-font-smoothing: antialiased; }
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0 }
.page { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; }
.page-header { margin-bottom: 1.5rem; }
.page-eyebrow { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .12em; font-weight: 500; margin-bottom: 6px; }
.page-title { font-size: 28px; font-weight: 500; margin-bottom: 8px; letter-spacing: -0.01em; line-height: 1.2; }
.page-sub { font-size: 14px; color: var(--text-secondary); max-width: 720px; line-height: 1.55; }
.page-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 10px; font-family: var(--font-mono); letter-spacing: -0.01em; }
.rm-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -0.25rem; padding: 0 0.25rem; }
.rm-inner { min-width: 820px; }
.rm-leg { display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:1.75rem 0 1.25rem;align-items:center }
.rm-lc { font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em;font-weight:500 }
.rm-chip { display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-md);cursor:pointer;user-select:none;transition:opacity .15s, background .15s;border:0.5px solid var(--border-tertiary);background:var(--bg-primary) }
.rm-chip:hover { background:var(--bg-secondary) }
.rm-chip.off { opacity:.4 }
.rm-d { width:10px;height:10px;border-radius:2px;flex-shrink:0 }
.rm-d.crit { background:#F0997B } .rm-d.high { background:#EF9F27 } .rm-d.med { background:#85B7EB }
.rm-b { display:inline-block;width:14px;height:10px;border-radius:2px;border:0.5px solid var(--border-tertiary) }
.rm-b.ea { background:#E1F5EE } .rm-b.ga { background:#FAEEDA } .rm-b.po { background:#EEEDFE }
.rm-lm { display:inline-flex;align-items:center;gap:6px }
.rm-g { display:grid;grid-template-columns:230px 1fr;column-gap:0;align-items:center }
.rm-mr { display:grid;grid-column:2;padding:0 0 8px }
.rm-mo { font-size:11px;color:var(--text-secondary);text-align:center;padding:6px 0;border-left:0.5px solid var(--border-tertiary);font-weight:500 }
.rm-mo:first-child { border-left-color:transparent }
.rm-mo.ea-edge { border-left:1px solid #BA7517 }
.rm-mo.ga-edge { border-left:1px solid #1D9E75 }
.rm-mo.po-edge { border-left:1px solid #BA7517 }
.rm-lh { grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:16px 0 8px;margin-top:6px;border-top:0.5px solid var(--border-secondary) }
.rm-lh.first { border-top:none;margin-top:0;padding-top:8px }
.rm-li { font-size:17px;color:var(--text-secondary) }
.rm-ln { font-size:12px;font-weight:500;color:var(--text-primary);text-transform:uppercase;letter-spacing:.08em }
.rm-lt { font-size:10px;color:var(--text-tertiary);font-family:var(--font-mono);margin-left:auto }
.rm-l { padding:7px 14px 7px 0;font-size:13px;color:var(--text-primary);line-height:1.35 }
.rm-w { display:block;font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono);margin-top:3px;letter-spacing:-.02em;line-height:1.3 }
.rm-t { position:relative;height:32px;margin:2px 0;background:var(--phase-gradient);border-radius:3px }
.rm-r { position:absolute;top:5px;height:22px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;transition:transform .12s,outline .12s;border:0.5px solid;box-sizing:border-box;min-width:10px;font-family:inherit }
.rm-r:hover { transform:translateY(-1px);z-index:3;outline:1.5px solid currentColor;outline-offset:1px }
.rm-r:focus-visible { outline:2px solid var(--text-primary);outline-offset:2px }
.rm-r.crit { background:#F0997B;color:#4A1B0C;border-color:#993C1D }
.rm-r.high { background:#EF9F27;color:#412402;border-color:#854F0B }
.rm-r.med { background:#85B7EB;color:#042C53;border-color:#185FA5 }
.rm-r.hd { display:none }
.rm-ml { padding:0 14px 0 0;font-size:11px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;align-self:start;border-top:0.5px solid var(--border-secondary);margin-top:18px;padding-top:24px }
.rm-mt { grid-column:2;position:relative;height:58px;border-top:0.5px solid var(--border-secondary);margin-top:18px;padding-top:14px }
.rm-m { position:absolute;transform:translateX(-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center;top:10px;background:none;border:none;font:inherit;color:inherit;padding:0 }
.rm-md { width:14px;height:14px;background:#1D9E75;transform:rotate(45deg);border:0.5px solid #04342C;transition:transform .12s }
.rm-m:hover .rm-md { transform:rotate(45deg) scale(1.18) }
.rm-mc { font-size:10px;color:var(--text-secondary);margin-top:10px;white-space:nowrap;line-height:1.3;text-align:center }
.rm-mc b { display:block;color:var(--text-primary);font-weight:500;font-size:11px }
@media (prefers-color-scheme: dark) {
.rm-t { background:var(--phase-gradient-dark) }
.rm-r.crit { background:#712B13;color:#F5C4B3;border-color:#D85A30 }
.rm-r.high { background:#633806;color:#FAC775;border-color:#BA7517 }
.rm-r.med { background:#0C447C;color:#B5D4F4;border-color:#378ADD }
.rm-b.ea { background:rgba(29,158,117,.32) } .rm-b.ga { background:rgba(186,117,23,.32) } .rm-b.po { background:rgba(127,119,221,.32) }
.rm-d.crit { background:#D85A30 } .rm-d.high { background:#BA7517 } .rm-d.med { background:#378ADD }
.rm-md { background:#5DCAA5;border-color:#9FE1CB }
.rm-mo.ga-edge { border-left-color:#5DCAA5 } .rm-mo.po-edge { border-left-color:#EF9F27 }
}
.page-foot { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 0.5px solid var(--border-tertiary); font-size: 11px; color: var(--text-tertiary); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; line-height: 1.5; }
.page-foot strong { font-weight: 500; color: var(--text-secondary); }
.mo { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100; }
.mo.open { opacity: 1; pointer-events: auto; }
.mo-c { background: var(--bg-primary); border-radius: var(--radius-lg); max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 1.75rem 1.75rem 1.5rem; box-shadow: 0 12px 48px rgba(0,0,0,0.25); border: 0.5px solid var(--border-secondary); }
.mo-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.mo-t { font-size: 18px; font-weight: 500; line-height: 1.35; color: var(--text-primary); }
.mo-x { background: none; border: none; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 22px; color: var(--text-secondary); line-height: 1; flex-shrink: 0; }
.mo-x:hover { background: var(--bg-secondary); color: var(--text-primary); }
.mo-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; font-size: 12px; color: var(--text-tertiary); }
.mo-pr { padding: 3px 9px; border-radius: 4px; font-weight: 500; font-size: 11px; letter-spacing: 0.02em; }
.mo-pr.crit { background: #F0997B; color: #4A1B0C; }
.mo-pr.high { background: #EF9F27; color: #412402; }
.mo-pr.med { background: #85B7EB; color: #042C53; }
.mo-dates { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
.mo-wav { font-family: var(--font-mono); font-size: 11px; }
.mo-lane { color: var(--text-tertiary); }
.mo-body { font-size: 14px; line-height: 1.65; color: var(--text-primary); }
@media (prefers-color-scheme: dark) {
.mo-pr.crit { background: #712B13; color: #F5C4B3; }
.mo-pr.high { background: #633806; color: #FAC775; }
.mo-pr.med { background: #0C447C; color: #B5D4F4; }
}
@media (max-width: 720px) {
  .page { padding: 1.5rem 1rem 2rem; }
  .page-title { font-size: 22px; }
}
</style>
</head>
<body>
<div class="page">
<header class="page-header">
<div class="page-eyebrow" id="page-eyebrow"></div>
<h1 class="page-title" id="page-title"></h1>
<div class="page-sub" id="page-sub"></div>
<div class="page-meta" id="page-meta"></div>
</header>
<h2 class="sr-only" id="page-srtitle"></h2>
<div class="rm-leg" id="rm-leg"></div>
<div class="rm-scroll"><div class="rm-inner">
<div class="rm-g" id="rm-grid"></div>
</div></div>
<footer class="page-foot">
<div id="page-foot-l"></div>
<div id="page-foot-r"></div>
</footer>
</div>
<div class="mo" id="modal" onclick="cm(event,true)" role="dialog" aria-modal="true" aria-labelledby="mo-t">
<div class="mo-c" onclick="event.stopPropagation()">
<div class="mo-h">
<h2 class="mo-t" id="mo-t"></h2>
<button class="mo-x" onclick="cm()" aria-label="Close detail">×</button>
</div>
<div class="mo-meta">
<span class="mo-pr" id="mo-pr"></span>
<span class="mo-dates" id="mo-dates"></span>
<span class="mo-wav" id="mo-wav"></span>
<span class="mo-lane" id="mo-lane"></span>
</div>
<div class="mo-body" id="mo-b"></div>
</div>
</div>
<script src="data.js"></script>
<script>
(function render() {
  const D = window.ROADMAP_DATA;
  if (!D) { document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif">ERROR: data.js failed to load. Check the file is present and the &lt;script src="data.js"&gt; tag is correct.</p>'; return; }

  // --- Helpers ---
  const T_START = new Date(D.timeline.start + 'T00:00:00').getTime();
  const T_END = new Date(D.timeline.end + 'T00:00:00').getTime() + 86400000;
  const T_TOTAL = T_END - T_START;

  function pct(dateStr, endOfDay) {
    const t = new Date(dateStr + 'T00:00:00').getTime() + (endOfDay ? 86400000 : 0);
    return ((t - T_START) / T_TOTAL) * 100;
  }
  function fmtBar(d) {
    const dt = new Date(d + 'T00:00:00');
    return (dt.getMonth() + 1) + '/' + dt.getDate();
  }
  function fmtLong(d) {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }
  function priLabel(p) { return p === 'crit' ? 'Critical' : p === 'high' ? 'High' : 'Medium'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  // --- Phase background gradient ---
  function buildGradient(dark) {
    const colors = dark
      ? { ea: 'rgba(29,158,117,.2)', ga: 'rgba(186,117,23,.2)', po: 'rgba(127,119,221,.22)' }
      : { ea: '#E1F5EE', ga: '#FAEEDA', po: '#EEEDFE' };
    const fallback = dark ? 'rgba(255,255,255,0.05)' : '#F1EFE8';
    if (!D.phases || !D.phases.length) {
      return `linear-gradient(to right, ${fallback} 0%, ${fallback} 100%)`;
    }
    const stops = [];
    D.phases.forEach((ph, i) => {
      const left = pct(ph.start);
      const right = pct(ph.end, true);
      const c = colors[ph.id] || fallback;
      if (i === 0) stops.push(`${c} ${left.toFixed(3)}%`);
      stops.push(`${c} ${right.toFixed(3)}%`);
      if (i < D.phases.length - 1) {
        const nextC = colors[D.phases[i+1].id] || fallback;
        stops.push(`${nextC} ${right.toFixed(3)}%`);
      }
    });
    return `linear-gradient(to right, ${stops.join(', ')})`;
  }
  document.documentElement.style.setProperty('--phase-gradient', buildGradient(false));
  document.documentElement.style.setProperty('--phase-gradient-dark', buildGradient(true));

  // --- Page chrome ---
  document.title = D.meta.pageTitle || D.meta.title;
  document.getElementById('page-eyebrow').textContent = D.meta.eyebrow || '';
  document.getElementById('page-title').textContent = D.meta.title || '';
  document.getElementById('page-sub').textContent = D.meta.subtitle || '';
  document.getElementById('page-meta').textContent = 'Last updated · ' + (D.meta.lastUpdated || '') + ' · Confidential';
  document.getElementById('page-foot-l').innerHTML = '<strong>' + esc(D.meta.title) + '</strong> · ' + esc(D.meta.footerLeft || '');
  document.getElementById('page-foot-r').textContent = D.meta.footerRight || '';
  const laneNames = D.lanes.map(l => l.name.split(' · ')[0]).join(', ');
  document.getElementById('page-srtitle').textContent = 'Wavelength platform roadmap from ' + D.timeline.start + ' to ' + D.timeline.end + ' across ' + D.lanes.length + ' lanes: ' + laneNames + ', with ' + D.milestones.length + ' milestones.';

  // --- Legend ---
  let legHTML = '<span class="rm-lc">Priority</span>';
  ['crit','high','med'].forEach(p => {
    legHTML += '<span class="rm-chip" data-prio="' + p + '" onclick="rmTP(\'' + p + '\',this)"><span class="rm-d ' + p + '"></span>' + priLabel(p) + '</span>';
  });
  legHTML += '<span class="rm-lc" style="margin-left:6px">Phase</span>';
  D.phases.forEach(p => {
    legHTML += '<span class="rm-lm"><span class="rm-b ' + esc(p.id) + '"></span>' + esc(p.label) + '</span>';
  });
  legHTML += '<span class="rm-lc" style="margin-left:6px">Milestone</span>';
  legHTML += '<span class="rm-lm"><span style="width:10px;height:10px;background:#1D9E75;transform:rotate(45deg);display:inline-block"></span>Go-live</span>';
  document.getElementById('rm-leg').innerHTML = legHTML;

  // --- Months ---
  const months = [];
  const startD = new Date(D.timeline.start + 'T00:00:00');
  const endD = new Date(D.timeline.end + 'T00:00:00');
  let cur = new Date(startD.getFullYear(), startD.getMonth(), 1);
  while (cur <= endD) {
    months.push({
      label: cur.toLocaleString('en-US', { month: 'short' }) + ' ' + String(cur.getFullYear()).slice(-2),
      year: cur.getFullYear(),
      month: cur.getMonth()
    });
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  // Mark months that start a new phase (skip the first phase)
  months.forEach(m => {
    D.phases.forEach((ph, i) => {
      if (i === 0) return;
      const phStart = new Date(ph.start + 'T00:00:00');
      if (phStart.getMonth() === m.month && phStart.getFullYear() === m.year) m.edge = ph.id;
    });
  });

  // --- Grid ---
  let g = '<div></div>';
  g += '<div class="rm-mr" style="grid-template-columns:repeat(' + months.length + ',1fr)">';
  months.forEach(m => {
    g += '<div class="rm-mo' + (m.edge ? ' ' + m.edge + '-edge' : '') + '">' + esc(m.label) + '</div>';
  });
  g += '</div>';

  D.lanes.forEach((lane, idx) => {
    g += '<div class="rm-lh' + (idx === 0 ? ' first' : '') + '"><i class="ti ' + esc(lane.icon) + ' rm-li" aria-hidden="true"></i><span class="rm-ln">' + esc(lane.name) + '</span><span class="rm-lt">' + esc(lane.tag) + '</span></div>';
    const laneItems = D.items.filter(it => it.lane === lane.id);
    laneItems.forEach(item => {
      const left = pct(item.start);
      const right = pct(item.end, true);
      const width = right - left;
      let barLabel;
      if (item.barLabel !== undefined) {
        barLabel = item.barLabel;
      } else if (width >= 7) {
        barLabel = fmtBar(item.start) + ' → ' + fmtBar(item.end);
      } else {
        barLabel = '';
      }
      const aria = item.title + ', ' + fmtBar(item.start) + ' to ' + fmtBar(item.end);
      g += '<div class="rm-l">' + esc(item.title) + '<span class="rm-w">' + esc(item.wavShort || '') + '</span></div>';
      g += '<div class="rm-t"><button class="rm-r ' + esc(item.priority) + '" style="left:' + left.toFixed(2) + '%;width:' + width.toFixed(2) + '%" data-prio="' + esc(item.priority) + '" data-id="' + esc(item.id) + '" onclick="oi(\'' + esc(item.id) + '\')" aria-label="' + esc(aria) + '">' + esc(barLabel) + '</button></div>';
    });
  });

  g += '<div class="rm-ml">Milestones</div>';
  g += '<div class="rm-mt">';
  D.milestones.forEach(m => {
    let pos = pct(m.date, true);
    if (pos > 99) pos = 99;
    g += '<button class="rm-m" style="left:' + pos.toFixed(2) + '%" data-id="' + esc(m.id) + '" onclick="oi(\'' + esc(m.id) + '\')" aria-label="' + esc(m.title) + '"><span class="rm-md"></span><span class="rm-mc"><b>' + esc(m.label) + '</b>' + esc(m.shortDate) + '</span></button>';
  });
  g += '</div>';

  document.getElementById('rm-grid').innerHTML = g;

  // --- Build items lookup for modal ---
  const lookup = {};
  D.items.forEach(it => {
    lookup[it.id] = {
      title: it.title,
      priority: it.priority,
      dates: fmtLong(it.start) + ' → ' + fmtLong(it.end),
      wav: it.wavShort || '',
      lane: (D.lanes.find(l => l.id === it.lane) || {}).name || it.lane,
      body: it.detail || ''
    };
  });
  D.milestones.forEach(m => {
    lookup[m.id] = {
      title: m.title,
      priority: m.priority || 'crit',
      dates: m.dates || fmtLong(m.date),
      wav: m.wav || '',
      lane: 'Milestone',
      body: m.detail || ''
    };
  });
  window._items = lookup;
})();

function oi(id) {
  const it = window._items && window._items[id]; if (!it) return;
  document.getElementById('mo-t').textContent = it.title;
  const pr = document.getElementById('mo-pr');
  pr.className = 'mo-pr ' + it.priority;
  pr.textContent = it.priority === 'crit' ? 'Critical' : it.priority === 'high' ? 'High' : 'Medium';
  document.getElementById('mo-dates').textContent = it.dates;
  document.getElementById('mo-wav').textContent = it.wav;
  document.getElementById('mo-lane').textContent = it.lane ? '· ' + (it.lane.split(' · ')[0]) : '';
  document.getElementById('mo-b').textContent = it.body;
  document.getElementById('modal').classList.add('open');
}
function cm(e, fromOverlay) {
  if (fromOverlay && e && e.target.id !== 'modal') return;
  document.getElementById('modal').classList.remove('open');
}
function rmTP(p, el) {
  el.classList.toggle('off');
  const h = el.classList.contains('off');
  document.querySelectorAll('.rm-r[data-prio="' + p + '"]').forEach(b => {
    if (h) b.classList.add('hd'); else b.classList.remove('hd');
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') cm(); });
</script>
</body>
</html>
